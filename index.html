<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Szachy – Elias Wren</title>

<style>
body{
    font-family:Georgia,serif;
    background:#f4f1ea;
    margin:0;
    padding:10px;
    color:#222;
    overflow-x:hidden;
}

#game,#story{
    max-width:900px;
    margin:auto;
}

.hidden{
    display:none;
}

.task{
    font-size:1.2em;
    font-weight:bold;
    margin-bottom:15px;
    text-align:center;
}

.board-wrap{
    display:flex;
    gap:12px;
    justify-content:center;
    align-items:flex-start;
}

.board{
    display:grid;
    grid-template-columns:repeat(8,1fr);
    grid-template-rows:repeat(8,1fr);

    width:min(calc(100vw - 40px), 500px);
    max-width:500px;

    aspect-ratio:1/1;

    border:2px solid #333;

    background:url("background.png") center center / cover no-repeat;

    overflow:visible;
}

.sq{
    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    position:relative;
    overflow:visible;

    transition:background .15s;
}

.sq:hover{
    filter:brightness(1.08);
}

.light{
    background:rgba(240,217,181,.55);
}

.dark{
    background:rgba(181,136,99,.55);
}

.coords-y{
    display:grid;
    grid-template-rows:repeat(8,1fr);

    height:calc(100vw - 50px);
    max-height:500px;

    align-items:center;

    width:20px;
    text-align:center;
    font-weight:bold;
}

.coords-x{
    display:grid;
    grid-template-columns:repeat(8,1fr);

    width:min(calc(100vw - 40px), 500px);
    max-width:500px;

    text-align:center;
    margin-top:4px;
    font-weight:bold;
}

.traveler{
    position:absolute;

    width:120%;
    height:120%;

    object-fit:contain;

    left:50%;
    bottom:-33%;

    transform:translateX(-50%);

    pointer-events:none;
    z-index:100;
}

.card{
    background:white;
    padding:24px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
    line-height:1.7;
}

button,
a.btn{
    display:inline-block;
    margin-top:20px;
    padding:12px 20px;
    background:#333;
    color:#fff;
    text-decoration:none;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

@media (max-width:600px){

    body{
        padding:10px;
    }

    .card{
        padding:18px;
        font-size:1rem;
        line-height:1.8;
    }

    .task{
        font-size:1.05rem;
        padding:0 10px;
    }

    button,
    a.btn{
        width:100%;
        box-sizing:border-box;
        text-align:center;
    }
}
</style>
</head>

<body>

<div id="game">

    <div class="task" id="task"></div>

    <div class="board-wrap">

        <div class="coords-y" id="cy"></div>

        <div>
            <div class="board" id="board"></div>
            <div class="coords-x" id="cx"></div>
        </div>

    </div>

</div>

<div id="story" class="hidden">

    <div class="card">

        <div id="text"></div>

        <div id="action"></div>

    </div>

</div>

<script>

const tasks=[
    "Wykonaj 3 ruchy wieżą",
    "Wykonaj 2 ruchy gońcem",
    "Wykonaj 5 ruchów wieżą",
    "Wykonaj 1 ruch koniem",
    "Wykonaj 2 ruchy gońcem"
];

let stage=0;
let current="A1";

const texts={

A1:`TEKST_A1`,

D1:`TEKST_D1`,

F3:`TEKST_F3`,

F8:`TEKST_F8`,

E6:`TEKST_E6`,

META:`TEKST_META`,

A3:`TEKST_BŁĘDU_A3`,

A4:`TEKST_BŁĘDU_A4`,

B3:`TEKST_BŁĘDU_B3`,

GROUP1:`TEKST_BŁĘDU_GROUP1`,
GROUP2:`TEKST_BŁĘDU_GROUP2`,

DEFAULT:`TEKST_BŁĘDU_DEFAULT`
};

const special={
    A3:"A3",
    A4:"A4",
    B3:"B3",

    C8:"GROUP1",
    G4:"GROUP1",
    G8:"GROUP1",

    D7:"GROUP2",
    G6:"GROUP2",
    H7:"GROUP2"
};

const board=document.getElementById("board");
const cy=document.getElementById("cy");
const cx=document.getElementById("cx");
const task=document.getElementById("task");

for(let r=8;r>=1;r--){

    for(let c=0;c<8;c++){

        const sq=document.createElement("div");

        const coord=
            String.fromCharCode(65+c)+r;

        sq.dataset.coord=coord;

        sq.className=
            "sq "+(((r+c)%2)?"dark":"light");

        sq.onclick=()=>clickSq(coord);

        board.appendChild(sq);
    }
}

for(let r=8;r>=1;r--){
    cy.innerHTML+=`<div>${r}</div>`;
}

for(let c=0;c<8;c++){
    cx.innerHTML+=`<div>${String.fromCharCode(65+c)}</div>`;
}

function draw(){

    document
        .querySelectorAll(".sq")
        .forEach(s=>s.innerHTML="");

    const el=document.querySelector(
        `[data-coord="${current}"]`
    );

    if(el){

        el.innerHTML=
        `<img src="traveler.png"
              class="traveler"
              alt="Traveler">`;
    }

    task.textContent=
        tasks[Math.min(stage,tasks.length-1)];
}

function showStory(text,btnLabel,cb){

    document
        .getElementById("game")
        .classList.add("hidden");

    document
        .getElementById("story")
        .classList.remove("hidden");

    document
        .getElementById("text")
        .innerHTML=text;

    const action=
        document.getElementById("action");

    action.innerHTML="";

    if(btnLabel){

        const b=document.createElement("button");

        b.textContent=btnLabel;
        b.onclick=cb;

        action.appendChild(b);
    }
}

function backToBoard(){

    document
        .getElementById("story")
        .classList.add("hidden");

    document
        .getElementById("game")
        .classList.remove("hidden");

    draw();
}

function resetGame(){

    stage=0;
    current="A1";

    backToBoard();
}

function clickSq(coord){

    if(stage===0 && coord==="D1"){

        current="D1";
        stage=1;

        showStory(
            texts.D1,
            "Kontynuuj",
            backToBoard
        );

        return;
    }

    if(stage===1 && coord==="F3"){

        current="F3";
        stage=2;

        showStory(
            texts.F3,
            "Kontynuuj",
            backToBoard
        );

        return;
    }

    if(stage===2 && coord==="F8"){

        current="F8";
        stage=3;

        showStory(
            texts.F8,
            "Kontynuuj",
            backToBoard
        );

        return;
    }

    if(stage===3 && coord==="E6"){

        current="E6";
        stage=4;

        showStory(
            texts.E6,
            "Kontynuuj",
            backToBoard
        );

        return;
    }

    if(stage===4 && coord==="C4"){

        showStory(
            texts.META +
            `<br><br>
            <a class="btn"
            href="https://sites.google.com/view/punkt-3-szach/strona-g%C5%82%C3%B3wna">
            Przejdź dalej
            </a>`,
            "Zostań tutaj",
            backToBoard
        );

        return;
    }

    const key=
        special[coord] || "DEFAULT";

    showStory(
        texts[key],
        "Wróć do początku",
        resetGame
    );
}

showStory(
    texts.A1,
    "Rozpocznij",
    backToBoard
);

draw();

</script>

</body>
</html>
