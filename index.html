fixed<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Szachy – Elias Wren</title>

<style>
body{
    font-family:Georgia,serif;
    background:url("background.png") center center / cover fixed no-repeat;
    margin:0;
    padding:10px;
    color:#222;
    overflow-x:hidden;
}
@keyframes boardGlow{
    0%{
        filter:brightness(1);
    }

    50%{
        filter:brightness(1.08);
    }

    100%{
        filter:brightness(1);
    }
}

.board{
    animation:boardGlow 6s ease-in-out infinite;
}
#game,#story{
    max-width:900px;
    margin:40px auto 0 auto;
}

.hidden{
    display:none;
}

.task{
    font-size:1.2em;
    font-weight:bold;
    margin-bottom:15px;
    text-align:center;
}

.board-wrap{
    display:flex;
    gap:12px;
    justify-content:center;
    align-items:flex-start;
}

.board{
    display:grid;
    grid-template-columns:repeat(8,1fr);
    grid-template-rows:repeat(8,1fr);

    width:min(calc(100vw - 40px), 500px);
    max-width:500px;

    aspect-ratio:1/1;

    border:2px solid #333;

    background:url("background.png") center center / cover no-repeat;

    overflow:visible;
}

.sq{
    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    position:relative;
    overflow:visible;

    transition:background .15s;
}

.sq:hover{
    filter:brightness(1.08);
}

.light{
    background:rgba(240,217,181,.55);
}

.dark{
    background:rgba(181,136,99,.55);
}

.coords-y{
    display:grid;
    grid-template-rows:repeat(8,1fr);

    height:calc(100vw - 50px);
    max-height:500px;

    align-items:center;

    width:20px;
    text-align:center;
    font-weight:bold;
}

.coords-x{
    display:grid;
    grid-template-columns:repeat(8,1fr);

    width:min(calc(100vw - 40px), 500px);
    max-width:500px;

    text-align:center;
    margin-top:4px;
    font-weight:bold;
}

.traveler{
    position:absolute;

    width:130%;
    height:130%;

    object-fit:contain;

    left:50%;
    bottom:9%;

    transform:translateX(-50%);

    pointer-events:none;
    z-index:100;
}

.card{
    background:white;
    padding:24px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
    line-height:1.7;
}

button,
a.btn{
    display:inline-block;
    margin-top:20px;
    padding:12px 20px;
    background:#333;
    color:#fff;
    text-decoration:none;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

@media (max-width:600px){

    body{
        padding:10px;
    }

    .card{
        padding:18px;
        font-size:1rem;
        line-height:1.8;
    }

    .task{
        font-size:1.05rem;
        padding:0 10px;
    }

    button,
    a.btn{
        width:100%;
        box-sizing:border-box;
        text-align:center;
    }
}
</style>
</head>

<body>

<div id="game">

    <div class="task" id="task"></div>

    <div class="board-wrap">

        <div class="coords-y" id="cy"></div>

        <div>
            <div class="board" id="board"></div>
            <div class="coords-x" id="cx"></div>
        </div>

    </div>

</div>

<div id="story" class="hidden">

    <div class="card">

        <div id="text"></div>

        <div id="action"></div>

    </div>

</div>

<script>

const tasks=[
    "Wykonaj 3 ruchy wieżą",
    "Wykonaj 2 ruchy gońcem",
    "Wykonaj 5 ruchów wieżą",
    "Wykonaj 1 ruch koniem",
    "Wykonaj 2 ruchy gońcem"
];

let stage=0;
let current="A1";

const texts={

A1:`Gdy mój mentor rozpoczynał moje szkolenie, uwielbiał zadawać pytania, <br><br>
na które nie istniała jedna poprawna odpowiedź.<br><br>
Doprowadzało mnie to do szaleństwa.<br><br>
Pamiętam, jak pewnego dnia pokazał mi planszę szachową i zapytał:<br><br>
„Który ruch jest najlepszy?”<br><br>
Przez godzinę próbowałem znaleźć właściwą odpowiedź.<br><br>
On przez godzinę siedział obok i pił herbatę.<br><br>
Dopiero później zrozumiałem, że pytanie było błędne.<br><br>
Nie istnieje najlepszy ruch.<br><br>
Istnieje tylko najlepszy ruch w danym momencie.<br><br>
Granica działa podobnie.<br><br>
Każdego dnia trzeba podejmować decyzje przy niepełnych informacjach.<br><br>
Czasem trzeba zaufać doświadczeniu.<br><br>
Czasem intuicji.<br><br>
A czasem zwyczajnie zrobić krok naprzód i sprawdzić, co się wydarzy.<br><br>
Wiem, że brzmi to mało profesjonalnie.<br><br>
Ale po trzystu latach przestałem wierzyć ludziom, <br><br>
którzy twierdzą, że zawsze wiedzą, co robią.<br><br>
Najbardziej niebezpieczni bywają właśnie oni.<br><br>
Dzisiejsze zadanie jest prostsze.<br><br>
Przynajmniej dla mnie.<br><br>
Dla ciebie zapewne stanie się kolejnym dowodem na to, <br><br>
że Strażnicy mają bardzo dziwne poczucie rozrywki.<br><br>
czas sprawdzić, czy potrafisz myśleć jak Strażnik.<br><br>
Nie martw się, nie będę wymagał od ciebie <br><br>
rozegrania partii szachów przeciwko arcymistrzowi.<br><br>
Przynajmniej nie dzisiaj.<br><br>
Twoje pierwsze zadanie: porusz się jak wieża o 3 pola.<br><br>
Gdy dotrzesz na właściwe pole, odszukaj kolejną wiadomość.<br><br>
— Elias<br><br>
<br><br>
awaryjne hasło:<br><br>
WIEŻA<br><br>

`,

D1:`Dobrze.<br><br>
Niektóre decyzje mają tylko jedną poprawną odpowiedź.<br><br>
Większość ma ich znacznie więcej.<br><br>
Dlatego nie przejmuj się, jeżeli nie jesteś pewien kierunku.<br><br>
Najważniejsze jest, by zrobić następny krok.<br><br>
Porusz się jak goniec o 2 pola.<br><br>
— Elias<br><br>
`,

F3:`Czas sprawdzić, <br><br>czy potrafisz myśleć jak Strażnik.<br><br>
Porusz się jak wieża o 5 pól.<br><br>
Gdy dotrzesz na właściwe pole, <br><br>odszukaj kolejną wiadomość.<br><br>
— Elias<br><br>
`,

F8:`Zaczynam podejrzewać, <br><br>że jednak dasz sobie radę.<br><br>
Nie mów tego Kronikarzowi.<br><br>
Przez miesiąc chodziłby z miną człowieka, <br><br>który miał rację.<br><br>
Porusz się jak skoczek.<br><br>
— Elias<br><br>
`,

E6:`Nieźle.<br><br>
Jak dotąd nie zgubiłeś się bardziej <br><br>niż ja podczas pierwszego szkolenia.<br><br>
To obiecujące.<br><br>
Porusz się jak goniec o 2 pola.<br><br>
— Elias<br><br>
`,

META:`Jak zapewne zauważyłeś, istnieje wiele sposobów dotarcia do celu.<br><br>
To jedna z rzeczy, których nauczyły mnie zarówno szachy, jak i życie.<br><br>
Czasem liczy się plan.<br><br>
Czasem improwizacja.<br><br>
A czasem zwykłe szczęście.<br><br>
Niezależnie od tego, którą drogę obrałeś, dotarłeś we właściwe miejsce.<br><br>
Zapamiętaj swoje współrzędne.<br><br>
Liczby mają znaczenie.<br><br>
To właśnie tutaj zostawiłem dla ciebie kolejny fragment układanki.<br><br>
Zabierz go ze sobą.<br><br>
Przed nami następna Pieczęć.<br><br>
Tym razem poszukaj starej studni.<br><br>
Gdy ją odnajdziesz, przyjrzyj się dokładnie jej daszkowi.<br><br>
Właśnie tam czeka na ciebie kolejna wiadomość.<br><br>
Powodzenia.<br><br>
Ale zanim tam pójdziesz zapamiętaj swoją pozycję, liczby mają znaczenie.<br><br>
— Elias<br><br>
<br><br>
awaryjne hasło:<br><br>
HETMAN<br><br>
`,

A3:`zanim pójdziesz dalej, mam dla ciebie dobrą i złą wiadomość.<br><br>
Dobra jest taka, że wykonałeś polecenie.<br><br>
Zła jest taka, że nie doprowadziło cię ono tam, gdzie chciałem.<br><br>
Wróć do poprzedniego punktu i spróbuj ponownie.<br><br>
Tym razem wybierz inną drogę.<br><br>
— Elias<br><br>
`,

A4:`Hm.<br><br>
To nie tutaj.<br><br>
Wiem, bo specjalnie sprawdziłem.<br><br>
Przez chwilę miałem nadzieję, że może jednak to ja się pomyliłem.<br><br>
Niestety nie tym razem.<br><br>
Wróć do ostatniej wiadomości i wybierz drugi kierunek.<br><br>
— Elias<br><br>
`,

B3:`Gdyby to była prawdziwa partia szachów,<br><br>
właśnie straciłbyś figurę.<br><br>
Na szczęście to tylko ćwiczenie.<br><br>
Wróć do poprzedniego ruchu i spróbuj ponownie.<br><br>
— Elias<br><br>
`,

GROUP1:`Nie martw się.<br><br>
Mój mentor twierdził, że człowiek poznaje właściwą drogę głównie dzięki temu, <br><br>że wcześniej wybrał niewłaściwą.<br><br>
Podejrzewam, że wymyślił to po to, <br><br>żeby pocieszyć mnie podczas szkolenia.<br><br>
Tak czy inaczej...<br><br>
To nie jest właściwe pole.<br><br>
Spróbuj jeszcze raz.<br><br>
— Elias<br><br>
`,
GROUP2:`TEKST_BŁĘDU_GROUP2`,

DEFAULT:`Zastanawiałem się, czy ktoś wybierze tę drogę.<br><br>
Teraz już znam odpowiedź.<br><br>
Niestety kolejna wiadomość znajduje się gdzie indziej.<br><br>
Wróć do poprzedniego punktu.<br><br>
— Elias<br><br>
`
};

const special={
    A3:"A3",
    A4:"A4",
    B3:"B3",

    C8:"GROUP1",
    G4:"GROUP1",
    G8:"GROUP1",

    D7:"GROUP2",
    G6:"GROUP2",
    H7:"GROUP2"
};

const board=document.getElementById("board");
const cy=document.getElementById("cy");
const cx=document.getElementById("cx");
const task=document.getElementById("task");

for(let r=8;r>=1;r--){

    for(let c=0;c<8;c++){

        const sq=document.createElement("div");

        const coord=
            String.fromCharCode(65+c)+r;

        sq.dataset.coord=coord;

        sq.className=
            "sq "+(((r+c)%2)?"dark":"light");

        sq.onclick=()=>clickSq(coord);

        board.appendChild(sq);
    }
}

for(let r=8;r>=1;r--){
    cy.innerHTML+=`<div>${r}</div>`;
}

for(let c=0;c<8;c++){
    cx.innerHTML+=`<div>${String.fromCharCode(65+c)}</div>`;
}

function draw(){

    document
        .querySelectorAll(".sq")
        .forEach(s=>s.innerHTML="");

    const el=document.querySelector(
        `[data-coord="${current}"]`
    );

    if(el){

        el.innerHTML=
        `<img src="traveler.png"
              class="traveler"
              alt="Traveler">`;
    }

    task.textContent=
        tasks[Math.min(stage,tasks.length-1)];
}

function showStory(text,btnLabel,cb){

    document
        .getElementById("game")
        .classList.add("hidden");

    document
        .getElementById("story")
        .classList.remove("hidden");

    document
        .getElementById("text")
        .innerHTML=text;

    const action=
        document.getElementById("action");

    action.innerHTML="";

    if(btnLabel){

        const b=document.createElement("button");

        b.textContent=btnLabel;
        b.onclick=cb;

        action.appendChild(b);
    }
}

function backToBoard(){

    document
        .getElementById("story")
        .classList.add("hidden");

    document
        .getElementById("game")
        .classList.remove("hidden");

    draw();
}

function resetGame(){

    stage=0;
    current="A1";

    backToBoard();
}

function clickSq(coord){

    if(stage===0 && coord==="D1"){

        current="D1";
        stage=1;

        showStory(
            texts.D1,
            "Kontynuuj",
            backToBoard
        );

        return;
    }

    if(stage===1 && coord==="F3"){

        current="F3";
        stage=2;

        showStory(
            texts.F3,
            "Kontynuuj",
            backToBoard
        );

        return;
    }

    if(stage===2 && coord==="F8"){

        current="F8";
        stage=3;

        showStory(
            texts.F8,
            "Kontynuuj",
            backToBoard
        );

        return;
    }

    if(stage===3 && coord==="E6"){

        current="E6";
        stage=4;

        showStory(
            texts.E6,
            "Kontynuuj",
            backToBoard
        );

        return;
    }

    if(stage===4 && coord==="C4"){

        showStory(
            texts.META +
            `<br><br>
            <a class="btn"
            https://sites.google.com/view/dodatkowa-tresc/strona-g%C5%82%C3%B3wna
            Przejdź dalej
            </a>`,
            "Zostań tutaj",
            backToBoard
        );

        return;
    }

    const key=
        special[coord] || "DEFAULT";

    showStory(
        texts[key],
        "Wróć do początku",
        resetGame
    );
}

showStory(
    texts.A1,
    "Rozpocznij",
    backToBoard
);

draw();

</script>

</body>
</html>
